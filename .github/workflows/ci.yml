name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: node scripts/check.mjs
      - run: npm ci && npm run typecheck && npm test && npm run package
        working-directory: vscode
      - uses: actions/upload-artifact@v4
        with: { name: vscode, path: vscode/*.vsix }

  intellij:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - run: ./gradlew --no-daemon test buildPlugin
        working-directory: intellij
      - uses: actions/upload-artifact@v4
        with: { name: intellij, path: intellij/build/distributions/*.zip }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [vscode, intellij]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with: { merge-multiple: true }
      - run: gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes "See CHANGELOG.md." *.vsix *.zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
